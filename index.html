<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06182b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ocean Life</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap&subset=vietnamese" media="print" onload="this.media='all'">
<style>
  html,body{margin:0;height:100%;background:#06182b;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  #app{position:fixed;inset:0}
  button{font-family:inherit;border:0;cursor:pointer;-webkit-appearance:none;appearance:none}
  input,select{font-family:inherit}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;color:#bfe9ff;font-weight:800;letter-spacing:.5px;background:radial-gradient(ellipse at 50% 0,#12507f,#06182b 70%);z-index:1}
  #boot::before{content:"";width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.18);border-top-color:#5eead4;animation:bs 1s linear infinite}
  @keyframes bs{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div id="boot">Đang mở Ocean Life…</div></div>
<script>
/* Bộ giả lập khung "SPXGames" để ocean_ui.js chạy độc lập (không cần app SPX) */
window.SPXGames = { register: function(def){ window.__oceanDef = def; }, back: function(){}, cur: function(){ return 'ocean'; } };
document.documentElement.classList.add('oc-standalone');
</script>
<script src="ocean_data.js"></script>
<script src="ocean_art.js"></script>
<script src="ocean.js"></script>
<script src="ocean_icons.js"></script>
<script src="ocean_ui.js"></script>
<script src="main.js"></script>
</body>
</html>
