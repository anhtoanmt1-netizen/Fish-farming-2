name: Build Ocean Life APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài thư viện Capacitor
        run: npm install --no-audit --no-fund

      - name: Gom tệp web vào thư mục www
        run: |
          rm -rf www && mkdir -p www
          cp index.html main.js manifest.json sw.js ocean_data.js ocean_art.js ocean.js ocean_ui.js icon-192.png icon-512.png icon-maskable-512.png www/
          ls -la www

      - name: Tạo dự án Android
        run: npx cap add android

      - name: Thay icon ứng dụng
        run: |
          pip install pillow
          python3 make_icons.py

      - name: Đồng bộ tệp web vào Android
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Đổi tên APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OceanLife.apk

      - name: Lưu APK vào Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OceanLife-apk
          path: OceanLife.apk

      - name: Đăng APK lên mục Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ocean Life v1.0.${{ github.run_number }}
          body: Bản cài đặt Android (APK debug). Tải OceanLife.apk bên dưới rồi cài lên điện thoại.
          files: OceanLife.apk
          fail_on_unmatched_files: true
